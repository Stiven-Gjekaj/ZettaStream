name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the release key
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ZettaStream.apk
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ZettaStream.apk \
            --title "ZettaStream $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. On a TV, enter the code 8764108 in the Downloader app. The code opens https://github.com/${{ github.repository }}/releases/latest/download/ZettaStream.apk"
      # GitHub serves the release with a Let's Encrypt certificate. Android 7.0 does not trust
      # it. jsDelivr uses a GlobalSign root, which old TVs trust. The link names the commit, not
      # a branch, so no cache can give an old file. The tag keeps the commit on GitHub.
      - name: Give old TVs a jsDelivr link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir apk && cp ZettaStream.apk apk/ && cd apk
          git init -q -b apk
          git config user.name "Stiven Gjekaj"
          git config user.email "stivenagostingjekaj@gmail.com"
          git add ZettaStream.apk
          git commit -q -m "Add the APK of $GITHUB_REF_NAME"
          git tag "apk-$GITHUB_REF_NAME"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "apk-$GITHUB_REF_NAME"
          url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$(git rev-parse HEAD)/ZettaStream.apk"
          # jsDelivr gets the commit on the first request. Compare the file that it serves.
          want=$(sha256sum ZettaStream.apk | cut -d' ' -f1)
          for i in $(seq 1 10); do
            got=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1) || true
            [ "$got" = "$want" ] && break
            sleep 30
          done
          [ "$got" = "$want" ] || { echo "jsDelivr does not serve the APK at $url"; exit 1; }
          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.txt
          printf '\n\nAn old TV that cannot open the GitHub link can use %s\n' "$url" >> notes.txt
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.txt
